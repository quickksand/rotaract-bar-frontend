openapi: 3.0.3
info:
  title: OpenAPI definition
  version: 1.5.0
servers:
  - url: http://localhost:8080
    description: Generated server url
paths:
  /api/orders:
    get:
      tags:
        - purchase-order-controller
      summary: Get all orders
      description: This endpoint gets all currently saved orders
      operationId: getOrders
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: "Filter orders by year (e.g. 2025)"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Filter orders from this timestamp (inclusive)"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Filter orders until this timestamp (inclusive)"
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
    post:
      tags:
        - purchase-order-controller
      summary: Create new Order
      description: This endpoint creates a new purchase order
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrder"
        required: true
      responses:
        "201":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          description: Bad request - Invalid details provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
  /api/products:
    get:
      tags:
        - product-controller
      operationId: getProducts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /api/products/reset:
    post:
      tags:
        - product-controller
      operationId: resetProducts
      summary: Reset all products to their hardcoded default prices and stock status
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Unauthorized — valid Bearer token required
  /api/products/meta:
    get:
      tags:
        - product-controller
      operationId: getProductsMeta
      summary: Get product metadata including the last price update timestamp
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsMeta"
  /api/products/{id}:
    patch:
      tags:
        - product-controller
      operationId: updateProduct
      summary: Update price and/or stock status of a single product
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Unauthorized — valid Bearer token required
        "404":
          description: Product not found
  /api/auth/login:
    post:
      tags:
        - auth-controller
      operationId: login
      summary: Authenticate with admin PIN and receive a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid PIN
  /api/ingredients:
    get:
      tags:
        - ingredient-controller
      operationId: getIngredients
      summary: "Get all ingredients"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
  /api/orders/batch:
    post:
      tags:
        - purchase-order-controller
      summary: Batch import orders
      description: Imports multiple purchase orders in a single request. Orders that fail validation are skipped and reported in the errors list.
      operationId: importOrdersBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchOrderImport"
        required: true
      responses:
        "207":
          description: Multi-status — contains created orders and any import errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOrderResult"
        "400":
          description: Bad request - request body is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOrderResult"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOrderResult"
  /api/evaluation/summary:
    get:
      tags:
        - evaluation-controller
      summary: Get evaluation summary
      description: Returns aggregated earnings, tip, and cup/deposit statistics for the given filter
      operationId: getEvaluationSummary
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: "Filter by year (e.g. 2025)"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Filter from this timestamp (inclusive)"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Filter until this timestamp (inclusive)"
        - name: startCups
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          description: "Number of cups available at the start of the event"
        - name: depositAmountPerCup
          in: query
          required: false
          schema:
            type: number
            format: double
            default: 1.0
          description: "Deposit amount per cup in EUR"
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationSummary"
        "500":
          description: Internal server error
  /api/evaluation/top-products:
    get:
      tags:
        - evaluation-controller
      summary: Get top products by sales volume
      description: Returns products ranked by quantity sold. Use sortOrder=desc for best sellers, asc for worst sellers.
      operationId: getTopProducts
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: "Filter by year (e.g. 2025)"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Filter from this timestamp (inclusive)"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Filter until this timestamp (inclusive)"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
          description: "Maximum number of results to return"
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: "Sort order: desc = best sellers first, asc = worst sellers first"
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSalesEntry"
        "500":
          description: Internal server error
  /api/orders/{id}:
    get:
      tags:
        - purchase-order-controller
      summary: Get Order by id
      description: This endpoint gets all orders by provided id
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          description: Bad request - Invalid id provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrderedItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
        bottleSale:
          type: boolean
          default: false
          description: "Marks this item as a bottle sale for analytics"
        customPrice:
          type: number
          format: double
          minimum: 0
          description: "Negotiated price for bottle sales; overrides quantity × product price in totals"
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          format: double
        originalPrice:
          type: number
          format: double
          readOnly: true
          description: "Original (non-discounted) price set during initialization"
        category:
          type: string
          enum:
            - DRINKS
            - BEER_WINE_NONALC
            - SHOTS
          description: "Product category for bar organization"
        ingredientIds:
          type: array
          items:
            type: integer
            format: int64
          description: "List of ingredient IDs for this product"
        outOfStock:
          type: boolean
          default: false
          description: "When true, the product is hidden from the order view"
      required:
        - id
        - name
        - price
        - originalPrice
        - category
    Ingredient:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required:
        - id
        - name
    PurchaseOrder:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderedItem"
        returnedCupsCount:
          type: integer
          format: int32
          minimum: 0
        tipAmount:
          type: number
          format: double
          minimum: 0
          description: "Optional tip amount in EUR"
        paymentMethod:
          type: string
          enum: [ CASH, PAYPAL ]
          description: "Payment method used for this order"
        freeDrinksEarned:
          type: integer
          format: int32
          minimum: 0
          description: "Number of free drinks earned via stamp card in this order"
        freeDrinkDiscount:
          type: number
          format: double
          minimum: 0
          description: "Free drink discount applied via stamp card in EUR"
    BatchOrderImport:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrder"
          minItems: 1
    BatchOrderResult:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrder"
          description: "Successfully imported orders"
        errors:
          type: array
          items:
            type: string
          description: "Error messages for orders that could not be imported"
    ProductsMeta:
      type: object
      required:
        - productsUpdatedAt
      properties:
        productsUpdatedAt:
          type: string
          format: date-time
          description: "Timestamp of the last change to any product (price or stock status)"
    UpdateProductRequest:
      type: object
      properties:
        price:
          type: number
          format: double
          minimum: 0
          description: "New price for the product"
        outOfStock:
          type: boolean
          description: "New stock status for the product"
    LoginRequest:
      type: object
      required:
        - pin
      properties:
        pin:
          type: string
          description: "Admin PIN for authentication"
    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: "JWT token for subsequent admin requests"
    EvaluationSummary:
      type: object
      properties:
        totalRevenue:
          type: number
          format: double
          description: "Net revenue across all payment methods (CASH + PayPal), after freeDrinkDiscount, respecting customPrice for bottle sales"
        totalTips:
          type: number
          format: double
          description: "Sum of tip amounts across all matched orders (CASH + PayPal)"
        cashRevenue:
          type: number
          format: double
          description: "Net revenue from cash orders only (paymentMethod == CASH)"
        paypalRevenue:
          type: number
          format: double
          description: "Net revenue from PayPal orders only (paymentMethod == PAYPAL)"
        cashTips:
          type: number
          format: double
          description: "Sum of tip amounts from cash orders"
        paypalTips:
          type: number
          format: double
          description: "Sum of tip amounts from PayPal orders"
        expectedCashInRegister:
          type: number
          format: double
          description: "cashRevenue + cashTips + (totalCupsIssued - totalCupsReturned) × depositAmountPerCup"
        depositAmountPerCup:
          type: number
          format: double
          description: "Deposit amount per cup used in the calculation"
        totalCupsIssued:
          type: integer
          format: int32
          description: "Sum of tokensIssued across all matched orders"
        totalCupsReturned:
          type: integer
          format: int32
          description: "Sum of returnedCupsCount across all matched orders"
        cupsOutstanding:
          type: integer
          format: int32
          description: "Cups currently with customers: totalCupsIssued - totalCupsReturned"
        startCups:
          type: integer
          format: int32
          description: "Start cups as provided in the request parameter"
        orderCount:
          type: integer
          format: int32
          description: "Total number of orders in the filtered result"
    ProductSalesEntry:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        category:
          type: string
          enum:
            - DRINKS
            - BEER_WINE_NONALC
            - SHOTS
        totalQuantitySold:
          type: integer
          format: int32
          description: "Total units sold across all matched orders"
        totalRevenue:
          type: number
          format: double
          description: "Total revenue from this product: price × totalQuantitySold"
        rank:
          type: integer
          format: int32
          description: "Rank by sales volume (1 = highest)"
