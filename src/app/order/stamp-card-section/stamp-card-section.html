<!--
  WALLET-WORKAROUND (2026-06-03)
  10er-Wallet-Ansicht statt 4er-Papierkarten.
  Rückbau: siehe JSDoc in stamp-card-section.ts
-->
<section class="mb-5 bg-violet-50 border border-violet-100 rounded-lg px-3 py-3">
  @let enabled = (orderService.stampCardEnabled$ | async) === true;
  @let freeCount = (earnedFreeDrinksCount$ | async)!;
  <div class="flex items-center gap-3" [class.mb-3]="enabled">
    <span class="text-sm font-bold text-violet-800">🎫 Stempelkarte</span>
    <button
      class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors duration-200 focus:outline-none shrink-0"
      [class.bg-rotaract-cranberry]="enabled"
      [class.bg-gray-300]="!enabled"
      (click)="orderService.toggleStampCardEnabled()"
      [attr.aria-pressed]="enabled"
      aria-label="Stempelkarte aktivieren">
      <span
        class="inline-block h-4 w-4 rounded-full bg-white shadow-md transition-transform duration-200"
        [class.translate-x-6]="enabled"
        [class.translate-x-1]="!enabled">
      </span>
    </button>

    @if(enabled && freeCount > 0) {
      <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap ml-auto">
        {{ freeCount }}x gratis
      </span>
    }
  </div>

  @if(enabled) {
    <div class="pt-1">
      <div class="flex justify-center gap-1">
        @for(pos of row1; track pos) {
          <button
            class="w-8 h-8 rounded-full border-2 font-bold text-xs transition-colors flex items-center justify-center"
            [class.bg-amber-400]="pos === 5 && walletPosition >= 5"
            [class.border-amber-400]="pos === 5 && walletPosition >= 5"
            [class.bg-rotaract-cranberry]="pos !== 5 && walletPosition >= pos"
            [class.text-white]="walletPosition >= pos"
            [class.border-rotaract-cranberry]="pos !== 5 && walletPosition >= pos"
            [class.border-gray-300]="walletPosition < pos && pos !== 5"
            [class.border-gray-200]="walletPosition < pos && pos === 5"
            [class.text-gray-300]="walletPosition < pos && pos === 5"
            (click)="onWalletStampClick(pos)">
            @if(pos === 5) { ⭐ } @else { {{ pos }} }
          </button>
        }
      </div>
      <div class="flex justify-center gap-1 mt-1">
        @for(pos of row2; track pos) {
          <button
            class="w-8 h-8 rounded-full border-2 font-bold text-xs transition-colors flex items-center justify-center"
            [class.bg-amber-400]="pos === 10 && walletPosition >= 10"
            [class.border-amber-400]="pos === 10 && walletPosition >= 10"
            [class.bg-rotaract-cranberry]="pos !== 10 && walletPosition >= pos"
            [class.text-white]="walletPosition >= pos"
            [class.border-rotaract-cranberry]="pos !== 10 && walletPosition >= pos"
            [class.border-gray-300]="walletPosition < pos && pos !== 10"
            [class.border-gray-200]="walletPosition < pos && pos === 10"
            [class.text-gray-300]="walletPosition < pos && pos === 10"
            (click)="onWalletStampClick(pos)">
            @if(pos === 10) { ⭐ } @else { {{ pos }} }
          </button>
        }
      </div>


    </div>
  }
</section>
